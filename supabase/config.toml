[functions.admin-delete-user]
# The function validates the bearer token itself with auth.getUser(), then checks
# is_app_admin before it creates a service-role client. Keeping gateway JWT
# verification off also supports projects using Supabase's newer signing keys.
verify_jwt = false

[functions.admin-reset-password]
# Authentication and the app-admin check happen explicitly inside the function.
verify_jwt = false
