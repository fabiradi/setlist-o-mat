name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Deployment-Version erzeugen
        run: printf '{"version":"%s"}\n' "$GITHUB_SHA" > public/version.json

      - name: App bauen
        run: npm run build:pages
        env:
          # Beides sind bewusst öffentliche Browser-Zugangsdaten. Zugriffsschutz
          # erfolgt in Supabase über Auth und Row Level Security, nicht über den Key.
          NEXT_PUBLIC_SUPABASE_URL: https://jiqyajrtbbwaugcvfrqg.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_od1SwIY7bEHWYo_NzWYkTw_EYlEX5yU
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}

      - name: Seiten-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
